<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Baby Day</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Baby Day">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#FBF7F2" id="themeColor">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="topbar-title">
        <h1 id="title">Today</h1>
        <div id="subtitle" class="sub"></div>
      </div>
      <button id="syncBtn" class="icon-btn" aria-label="Sync status"><span id="syncDot" class="sync-dot"></span></button>
      <button id="settingsBtn" class="icon-btn" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68 1.65 1.65 0 0 0 10 3.17V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </header>

    <main id="view"></main>

    <nav class="tabbar">
      <button data-tab="today" class="tab active"><span class="tab-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span><span>Today</span></button>
      <button data-tab="log" class="tab"><span class="tab-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg></span><span>Log</span></button>
      <button data-tab="insights" class="tab"><span class="tab-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="3.5" rx="1.5"/><rect x="3" y="10.5" width="18" height="3.5" rx="1.5"/><rect x="3" y="16" width="12" height="3.5" rx="1.5"/></svg></span><span>Insights</span></button>
    </nav>
  </div>

  <div id="sheetWrap" class="sheet-wrap" hidden>
    <div class="sheet-backdrop" data-close></div>
    <section class="sheet" role="dialog" aria-modal="true">
      <div class="sheet-grip"></div>
      <div id="sheetBody"></div>
    </section>
  </div>

  <div id="toast" class="toast" hidden></div>
  <div id="tip" class="tip" hidden></div>

  <script>
    // ── Compatibility for older iPhones (iOS 15.0–15.3) ──
    if (!Array.prototype.at) Object.defineProperty(Array.prototype, 'at', { configurable: true, writable: true,
      value: function (n) { n = Math.trunc(n) || 0; if (n < 0) n += this.length; return this[n]; } });

    // ── Safety net: if the app can't start, explain why instead of showing a blank screen ──
    (function () {
      var FILES = ['app.js', 'model.js', 'store.js', 'styles.css'];
      var shown = false;
      function esc(t) { return String(t).replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); }
      function panel(html) {
        var v = document.getElementById('view');
        if (!v) return;
        v.innerHTML = '<div class="boot-error">' + html + '<br><button onclick="location.reload()">Reload</button></div>';
      }
      window.__bdShowError = function (title, err, opts) {
        var msg = err && (err.stack || err.message) || String(err || '');
        panel('<h2>' + esc(title) + '</h2>Your data is safe. Try Reload. If this keeps happening, send a screenshot of this message.' +
          '<div class="small-note"><code>' + esc(msg).slice(0, 600) + '</code></div>');
      };
      function diagnose(reason) {
        if (shown || window.__bdStarted) return;
        shown = true;
        if (location.protocol === 'file:') {
          panel('<h2>Open this from the web address, not the file</h2>The app has to be opened from your GitHub Pages address (https://…github.io/baby-tracker/), not by double-clicking index.html.');
          return;
        }
        Promise.all(FILES.map(function (f) {
          return fetch(f + '?check=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.ok ? null : f; }).catch(function () { return f; });
        })).then(function (missing) {
          missing = missing.filter(Boolean);
          if (missing.length) {
            panel('<h2>Some app files are missing</h2>The page loaded, but these files are not on your website:' +
              '<ul>' + missing.map(function (f) { return '<li><code>' + f + '</code></li>'; }).join('') + '</ul>' +
              'All the app files must sit together at the top level of your GitHub repo (no folders). ' +
              'Upload the missing ones with <b>Add file → Upload files</b>, commit, wait 1–2 minutes, then reload.');
          } else {
            window.__bdShowError('The app couldn’t start', reason || 'Unknown error during startup');
          }
        });
      }
      window.__bdDiagnose = diagnose;
      var lastErr = null;
      window.addEventListener('error', function (e) { if (!window.__bdStarted) lastErr = e.error || e.message; }, true);
      window.addEventListener('unhandledrejection', function (e) { if (!window.__bdStarted) lastErr = e.reason; });
      window.addEventListener('load', function () { setTimeout(function () { if (!window.__bdStarted) diagnose(lastErr); }, 2500); });
    })();
  </script>
  <script type="module" src="app.js" onerror="window.__bdDiagnose && window.__bdDiagnose('Could not load app.js')"></script>
  <script nomodule>
    document.getElementById('view').innerHTML = '<div class="boot-error"><h2>This browser is too old</h2>Please update iOS (Settings → General → Software Update) or use a current version of Safari or Chrome.</div>';
  </script>
  <script>
    if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  </script>
</body>
</html>
